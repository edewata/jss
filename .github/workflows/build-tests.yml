name: Build Tests

on: [push, pull_request]

jobs:
  wait-for-build:
    name: Waiting for build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for build
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.ref }}
          check-name: 'Building JSS'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
        if: github.event_name == 'push'

      - name: Wait for build
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: 'Building JSS'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
        if: github.event_name == 'pull_request'

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - 'debian:testing'
          - 'ubuntu:rolling'
    container: ${{ matrix.os }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'adopt'

    - name: Install dependencies
      run: |
        apt-get update

        # https://salsa.debian.org/freeipa-team/jss/-/blob/master/debian/control
        apt-get install -y \
            cmake \
            g++ \
            junit5 \
            libcommons-lang3-java \
            libnss3-dev \
            libnss3-tools \
            libopentest4j-java \
            libslf4j-java \
            maven \
            openjdk-25-jdk \
            unzip \
            zip

    - name: Build with CMake
      run: ./build.sh

    - name: Build with Maven
      run: mvn --batch-mode package

    - name: Compare jss.jar
      run: |
        jar tvf ~/build/jss/jss.jar \
            | awk '{print $8;}' \
            | sort \
            | grep -v '/$' \
            | tee cmake.out
        jar tvf base/target/jss.jar \
            | awk '{print $8;}' \
            | sort \
            | grep -v '/$' \
            | grep -v '^META-INF/maven/' \
            | tee maven.out
        diff cmake.out maven.out

    # TODO: Run examples

  fedora-test:
    name: Fedora Build Test
    needs: wait-for-build
    runs-on: ubuntu-latest
    env:
      SHARED: /tmp/workdir/jss
    steps:
    - name: Clone repository
      uses: actions/checkout@v7

    - name: Retrieve JSS images
      uses: actions/cache@v5
      with:
        key: jss-images-${{ github.sha }}
        path: jss-images.tar

    - name: Load JSS images
      run: docker load --input jss-images.tar

    - name: Set up JSS container
      run: |
        tests/bin/runner-init.sh \
            --image=jss-builder \
            --hostname=jss.example.com \
            jss

    - name: Build with CMake
      run: |
        docker exec jss ./build.sh --cmake='/usr/bin/cmake -DENABLE_NSS_VERSION_PQC_DEF=ON'

    - name: Build with Maven
      run: |
        docker exec jss mvn --batch-mode -pl '!native,!symkey,!examples' package

    - name: Compare jss.jar
      run: |
        docker exec jss \
            jar tvf /root/build/jss/jss.jar \
            | awk '{print $8;}' \
            | sort \
            | grep -v '/$' \
            | tee cmake.out
        docker exec jss \
            jar tvf base/target/jss.jar \
            | awk '{print $8;}' \
            | sort \
            | grep -v '/$' \
            | grep -v '^META-INF/maven/' \
            | tee maven.out
        diff cmake.out maven.out

    # TODO: Run examples

  symbol-test:
    name: Symbol Test
    uses: ./.github/workflows/symbol-test.yml

  rpm-test:
    name: RPM Test
    needs: wait-for-build
    uses: ./.github/workflows/rpm-test.yml

  sandbox-test:
    name: Sandbox Test
    needs: wait-for-build
    uses: ./.github/workflows/sandbox-test.yml

  version-number-test:
    name: Version number
    uses: ./.github/workflows/version-number-test.yml
